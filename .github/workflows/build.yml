name: Build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Compilar
        run: |
          set -o pipefail
          echo "Archivos en la raiz del repo:"; ls -la
          POM=$(find . -name pom.xml -not -path '*/target/*' | head -n 1)
          if [ -z "$POM" ]; then
            echo "::error::No hay pom.xml en el repositorio. Sube el CONTENIDO de la carpeta Regiones (pom.xml, src, .github) a la raiz."
            exit 1
          fi
          echo "Usando $POM"
          mvn -B -e -f "$POM" clean package 2>&1 | tee build.log

      - name: Mostrar el error en las anotaciones
        if: failure()
        run: |
          grep -E '\[ERROR\]|ERROR' build.log 2>/dev/null | head -n 15 | while read -r l; do echo "::error::$l"; done || true

      - uses: actions/upload-artifact@v4
        with:
          name: Regiones
          path: '**/target/Regiones.jar'
          if-no-files-found: error
